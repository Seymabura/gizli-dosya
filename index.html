<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gizli Dosya · Günün Vakası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0F12; --bg2:#14171c; --line:#252a31; --muted:#8a8f98; --text:#e8e4da;
  --gold:#D4AF37; --gold-dim:#8f7626; --blood:#8B0000; --blood-2:#b01a1a;
  --paper:#e9dfc6; --paper-2:#ddd0b0; --ink:#2a2318; --ink-soft:#5a4d37;
  --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
  --mono:'Courier Prime', 'Courier New', monospace;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-image:radial-gradient(ellipse at 50% -10%, #1c2028 0%, transparent 60%);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}
.view{min-height:100%}

/* ---------- Ortak parçalar ---------- */
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.badge.lvl-kolay{color:#7fb48a;border-color:#2f4a36}
.badge.lvl-orta{color:var(--gold);border-color:var(--gold-dim)}
.badge.lvl-zor{color:#e07a4a;border-color:#6a3420}
.badge.lvl-uzman{color:#e05656;border-color:#5c1a1a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:4px;
  font-weight:600;letter-spacing:.02em;transition:transform .08s, background .2s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:#16130a}
.btn-gold:hover{background:#e2bf4a}
.btn-ghost{border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--gold-dim)}
.btn-blood{background:var(--blood);color:#fff;box-shadow:0 0 0 1px #a31515 inset}
.btn-blood:hover{background:#9e0b0b}
.btn[disabled]{opacity:.4;pointer-events:none}

.paper{background:var(--paper);color:var(--ink);border-radius:3px;position:relative;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.03)),
    repeating-linear-gradient(0deg, rgba(90,70,40,.035) 0 1px, transparent 1px 3px);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 10px 24px rgba(0,0,0,.45);}
.paper .eyebrow{color:var(--blood)}
.typed{font-family:var(--mono);font-size:14px;line-height:1.6}

.seal{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;
  border:2px solid var(--blood);color:var(--blood);font-family:var(--mono);font-weight:700;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;transform:rotate(-14deg);opacity:.85;text-align:center;line-height:1.1;
  box-shadow:0 0 0 3px transparent, 0 0 0 4px rgba(139,0,0,.5) inset}
.stamp{font-family:var(--mono);font-weight:700;color:var(--blood);border:3px solid var(--blood);padding:4px 12px;
  text-transform:uppercase;letter-spacing:.15em;transform:rotate(-8deg);display:inline-block;opacity:.9}

/* ---------- ANA SAYFA ---------- */
.home{max-width:760px;margin:0 auto;padding:22px 18px 60px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand h1{font-family:var(--serif);font-size:26px;letter-spacing:.04em}
.brand h1 span{color:var(--gold)}
.brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em}

.daily{padding:24px 20px 22px;margin-bottom:34px;overflow:hidden}
.daily .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.daily h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin:10px 0 8px;color:#1d170e}
.daily .hook{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-soft);margin-bottom:16px}
.daily .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.daily .meta .badge{border-color:rgba(42,35,24,.25);color:var(--ink-soft)}
.daily .meta .badge.lvl-orta{color:#7a5c00;border-color:#b5932c}
.daily .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.countdown{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.countdown b{font-size:18px;color:var(--ink);letter-spacing:.06em}
.daily .btn-gold{background:#1d170e;color:var(--gold)}
.daily .ribbon{position:absolute;top:0;left:0;right:0;height:5px;background:var(--blood)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.section-h h3{font-family:var(--serif);font-size:20px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.07)}
.archive{display:grid;gap:10px}
.acard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);text-align:left;width:100%}
.acard:hover{border-color:#3a3f47}
.acard .no{font-family:var(--mono);color:var(--gold);font-size:13px;min-width:38px}
.acard .t{flex:1;min-width:0}
.acard .t b{display:block;font-family:var(--serif);font-size:16px;font-weight:700}
.acard .t span{font-size:12px;color:var(--muted)}
.acard.locked{opacity:.5;cursor:default}
.lock{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---------- VAKA MASASI ---------- */
.case{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.case-head{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:#0f1216}
.case-head .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.case-head h2{font-family:var(--serif);font-size:19px;line-height:1.2;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:8px}
.stat{font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--text)}
.stat i{font-style:normal;color:var(--gold);margin-right:4px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);background:#0f1216}
.tab{padding:11px 4px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tab svg{width:19px;height:19px}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

.panels{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.panels::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 110px}
.panel-inner{max-width:760px;margin:0 auto;display:grid;gap:16px}
.swipe-hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;letter-spacing:.08em}

.case-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(13,15,18,0), rgba(13,15,18,.95) 35%);pointer-events:none}
.case-foot .btn{width:100%;max-width:760px;margin:0 auto;display:flex;pointer-events:auto;font-size:16px;padding:15px}

/* Kartlar */
.card{padding:18px 16px}
.card h4{font-family:var(--serif);font-size:18px;margin:6px 0 10px}
.card p+p{margin-top:10px}
.hook-box{border-left:3px solid var(--gold);padding:4px 0 4px 14px;font-family:var(--serif);font-style:italic;font-size:17px;color:#d8d1c0}
.tl{list-style:none;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(42,35,24,.2)}
.tl li:last-child{border-bottom:0}
.tl b{font-family:var(--mono);color:var(--blood)}
.kroki{background:#f3ecd9;border:1px solid rgba(42,35,24,.2);border-radius:3px;padding:6px}
.kroki svg{display:block;width:100%;height:auto}
.numlist{list-style:none;counter-reset:n;display:grid;gap:9px}
.numlist li{counter-increment:n;padding-left:28px;position:relative}
.numlist li::before{content:counter(n);position:absolute;left:0;top:1px;width:19px;height:19px;border:1px solid var(--blood);color:var(--blood);
  border-radius:50%;font-family:var(--mono);font-size:11px;display:grid;place-items:center}
.quote{font-family:var(--mono);font-size:14px;padding:9px 0;border-bottom:1px dashed rgba(42,35,24,.2)}
.quote:last-child{border-bottom:0}

/* Şüpheliler */
.suspect{padding:16px}
.s-top{display:flex;gap:14px;align-items:flex-start}
.mugshot{flex:0 0 74px;height:92px;border-radius:2px;background:#2b2a27;position:relative;overflow:hidden;
  display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:900;color:#f0e8d4;
  box-shadow:0 0 0 4px #f6f0e0, 0 3px 8px rgba(0,0,0,.35);transform:rotate(-2deg);margin:4px 4px 0 2px}
.mugshot::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 12px)}
.mugshot .tag{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;font-weight:400;color:#cfc6b0}
.tape{position:absolute;top:-8px;left:50%;width:46px;height:16px;transform:translateX(-50%) rotate(3deg);background:rgba(212,175,55,.35)}
.s-info{flex:1;min-width:0}
.s-info h4{font-family:var(--serif);font-size:19px;margin:0}
.s-info .role{font-size:13px;color:var(--ink-soft);margin:2px 0 8px}
.rel{font-size:13.5px}
.alibi{margin-top:12px;padding:10px 12px;background:rgba(139,0,0,.06);border-left:3px solid var(--blood);font-family:var(--mono);font-size:13.5px}
.alibi small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blood);margin-bottom:3px;font-weight:600}
details.qa{margin-top:12px;border-top:1px solid rgba(42,35,24,.2);padding-top:10px}
details.qa summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between;color:var(--ink)}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";font-family:var(--mono);font-size:18px;line-height:1;color:var(--blood)}
details.qa[open] summary::after{content:"–"}
.qa-item{margin-top:10px;font-size:14px}
.qa-item .q{font-family:var(--mono);color:var(--ink-soft);font-size:13px}
.qa-item .a{margin-top:2px}
.mark-row{display:flex;gap:6px;margin-top:12px}
.mark{flex:1;padding:7px 4px;border:1px solid rgba(42,35,24,.25);border-radius:3px;font-size:12px;font-family:var(--mono);color:var(--ink-soft)}
.mark.on.m-supheli{background:var(--blood);color:#fff;border-color:var(--blood)}
.mark.on.m-elendi{background:#3d4a3f;color:#fff;border-color:#3d4a3f}
.mark.on.m-belirsiz{background:#7a6a43;color:#fff;border-color:#7a6a43}
.suspect.is-elendi{opacity:.62}
.suspect.is-elendi h4{text-decoration:line-through;text-decoration-color:var(--blood)}

/* Kanıtlar */
.ev{border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--bg2)}
.ev-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ev-code{font-family:var(--mono);font-size:12px;color:#16130a;background:var(--gold);padding:2px 7px;border-radius:2px;font-weight:700}
.ev-h b{font-family:var(--serif);font-size:16px;flex:1}
.ev-src{font-family:var(--mono);font-size:11px;color:var(--muted);padding:8px 14px 0}
.ev-body{padding:12px 14px 14px}
.ev-foot{display:flex;justify-content:flex-end;padding:0 14px 12px}
.ev-foot button{font-size:12px;font-family:var(--mono);color:var(--gold);border:1px dashed var(--gold-dim);padding:6px 10px;border-radius:3px}
.cctv{background:#07090a;border:1px solid #1d2a22;border-radius:3px;padding:10px 12px;font-family:var(--mono);font-size:13px;color:#9fd9a8;position:relative;overflow:hidden}
.cctv::before{content:"● REC";position:absolute;top:8px;right:10px;color:#e04848;font-size:10px;letter-spacing:.1em;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
.cctv::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px)}
.cctv .row{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid #12201a}
.cctv .row:last-child{border-bottom:0}
.cctv .row span:first-child{color:#d6c26a}
.ev-note{margin-top:10px;font-size:13px;color:var(--muted);font-style:italic}
.receipt{background:#f7f4ec;color:#222;font-family:var(--mono);font-size:13px;padding:14px 14px 18px;max-width:340px;margin:0 auto;position:relative;
  -webkit-mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 100%/12px 100% repeat-x;
          mask: radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) -6px 100%/12px 100% repeat-x;}
.receipt .rh{text-align:center;font-weight:700;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;letter-spacing:.05em}
.receipt .rr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:3px 0}
.receipt .rf{border-top:1px dashed #999;margin-top:8px;padding-top:8px;font-size:12px;color:#555}
.photo{background:#111;border-radius:3px;padding:8px 8px 6px;max-width:360px;margin:0 auto}
.photo svg{display:block;width:100%;height:auto;border-radius:2px}
.exif{margin-top:10px;font-family:var(--mono);font-size:12.5px;display:grid;gap:3px}
.exif div{display:grid;grid-template-columns:120px 1fr;gap:8px}
.exif span:first-child{color:var(--muted)}
.chat{margin-top:12px;background:#0b141a;border-radius:6px;padding:10px}
.chat .who{font-size:11px;color:#8aa0a8;margin-bottom:6px;font-family:var(--mono)}
.bubble{background:#005c4b;color:#e9edef;padding:8px 10px 6px;border-radius:8px 8px 2px 8px;margin-left:auto;max-width:88%;font-size:14px}
.bubble small{display:block;text-align:right;font-size:10.5px;color:#a6c4bc;margin-top:2px}
.docs{display:grid;gap:12px}
.docs .paper{padding:14px}
.docs h5{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blood);margin-bottom:6px}

/* Not defteri */
.notebook{padding:18px 16px 16px;background-color:#f1e9d2;
  background-image:linear-gradient(90deg, transparent 34px, rgba(139,0,0,.35) 34px 35px, transparent 35px),
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(60,90,140,.22) 27px 28px);}
.notebook textarea{width:100%;min-height:260px;border:0;outline:0;background:transparent;resize:vertical;
  font-family:var(--mono);font-size:15px;line-height:28px;color:#1f1a12;padding-left:28px}
.notebook .saved{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:right}
.hint{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:4px;background:var(--bg2)}
.hint .n{font-family:var(--mono);color:var(--gold);font-size:13px;min-width:62px}
.hint .body{flex:1;font-size:14px}
.hint.open{border-color:var(--gold-dim)}
.hint .btn{padding:8px 12px;font-size:13px}
.hint .lockedtxt{color:var(--muted);font-family:var(--mono);font-size:12.5px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,6,8,.82);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:700px){.modal{align-items:center}}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:#12151a;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:20px 18px 22px}
@media(min-width:700px){.sheet{border-radius:10px}}
.steps{display:flex;gap:6px;margin:10px 0 18px}
.steps i{flex:1;height:3px;background:var(--line);border-radius:2px}
.steps i.on{background:var(--gold)}
.sheet h3{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
.opt.on{border-color:var(--gold);background:rgba(212,175,55,.08)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto}
.opt.on .dot{border-color:var(--gold);background:radial-gradient(circle, var(--gold) 45%, transparent 50%)}
.opt small{display:block;color:var(--muted);font-size:12px}
.sheet .nav{display:flex;gap:10px;margin-top:18px}
.sheet .nav .btn{flex:1}
.verdict{margin-top:14px;padding:12px;border-radius:6px;border:1px solid #5c1a1a;background:rgba(139,0,0,.12);font-size:14px}

/* Sonuç */
.result{max-width:620px;margin:0 auto;padding:26px 18px 60px}
.result .paper{padding:26px 20px 22px;text-align:center;overflow:hidden}
.result h2{font-family:var(--serif);font-size:28px;margin:14px 0 4px;color:#1d170e}
.result .ribbon{position:absolute;top:0;left:0;right:0;height:5px;background:var(--blood)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 6px;text-align:left}
.grid4 div{border:1px solid rgba(42,35,24,.2);padding:10px 12px;border-radius:3px}
.grid4 small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.grid4 b{font-family:var(--mono);font-size:20px;color:var(--ink)}
.rank{font-family:var(--serif);font-size:22px;color:var(--blood);margin-top:12px}
.sharebox{margin-top:18px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:14px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;text-align:left}
.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.share-actions .btn{text-decoration:none}
.x-btn{background:#fff;color:#000}
.solution{margin-top:18px}
.solution summary{cursor:pointer;padding:14px;border:1px solid var(--line);border-radius:6px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.solution summary::-webkit-details-marker{display:none}
.solution .paper{margin-top:10px;text-align:left;padding:18px 16px}
.solution h5{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blood);margin:14px 0 6px}
.solution h5:first-child{margin-top:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#16130a;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13px;z-index:80;transition:opacity .3s}
</style>
</head>
<body>

<!-- =====================================================================
     VAKA VERİSİ (JSON)
     Yeni vaka eklemek için "vakalar" dizisine aynı yapıda bir nesne ekle.
     "gununVakasi" alanı, ana sayfada "Günün Vakası" olarak gösterilecek vakanın id'si.
     ===================================================================== -->
<script type="application/json" id="vaka-verisi">
{
  "gununVakasi": "vaka-014",
  "vakalar": [
    {
      "id": "vaka-014",
      "no": 14,
      "baslik": "Moda'da Kayıp Harita",
      "zorluk": "orta",
      "kategori": "Şehir Gizemi",

let acc = null;

function renderModal(){
  const steps = [
    { key: "supheli", title: "Suçlu kim?", sub: "Tek bir isim seç. Hata yapma hakkın sınırlı.",
      opts: CUR.supheliler.map(p => ({ id: p.id, t: p.ad, s: p.meslek })) },
    { key: "kanit", title: "Hangi kanıt yalanı çürütüyor?", sub: "Seçtiğin kişinin ifadesindeki çelişkiyi kesin olarak ortaya koyan kanıt hangisi?",
      opts: CUR.kanitlar.map(e => ({ id: e.id, t: `${e.kod} · ${e.baslik}`, s: e.kaynak })) },
    { key: "motivasyon", title: "Neden yaptı?", sub: "Suçun arkasındaki asıl motivasyon.",
      opts: CUR.suclama.motivasyonlar.map(m => ({ id: m.id, t: m.metin, s: m.aciklama })) }
  ];
  const st = steps[acc.step];
  const left = MAX_ATTEMPTS - S.attempts;
  $("sheet").innerHTML = `
    <div class="eyebrow">Suçlama · Adım ${acc.step + 1}/3 · Kalan hak: ${left}</div>
    <div class="steps">${steps.map((_, i) => `<i class="${i <= acc.step ? "on" : ""}"></i>`).join("")}</div>
    <h3>${st.title}</h3><p class="sub">${st.sub}</p>
    <div class="opts">${st.opts.map(o => `<button class="opt ${acc[st.key] === o.id ? "on" : ""}" data-id="${o.id}">
      <span class="dot"></span><span><b>${esc(o.t)}</b><small>${esc(o.s)}</small></span></button>`).join("")}</div>
    ${acc.verdict ? `<div class="verdict">${acc.verdict}</div>` : ""}
    <div class="nav">
      <button class="btn btn-ghost" id="mBack">${acc.step === 0 ? "Vazgeç" : "← Geri"}</button>
      <button class="btn ${acc.step === 2 ? "btn-blood" : "btn-gold"}" id="mNext" ${acc[st.key] ? "" : "disabled"}>${acc.step === 2 ? "⚖ Suçla" : "İleri →"}</button>
    </div>`;
  $("sheet").querySelectorAll(".opt").forEach(b => b.onclick = () => { acc[st.key] = b.dataset.id; acc.verdict = null; renderModal(); });
  $("mBack").onclick = () => { if(acc.step === 0) closeModal(); else { acc.step--; renderModal(); } };
  $("mNext").onclick = () => { if(acc.step < 2){ acc.step++; renderModal(); } else submitAccusation(); };
}

function submitAccusation(){
  const d = CUR.suclama.dogru;
  const parts = [acc.supheli === d.supheli, acc.kanit === d.kanit, acc.motivasyon === d.motivasyon];
  const ok = parts.filter(Boolean).length;
  S.attempts++; S.correctParts += ok; S.totalParts += 3;
  if(ok === 3 || S.attempts >= MAX_ATTEMPTS){
    finish(ok === 3); return;
  }
  saveState(); updateStats();
  acc.step = 0;
  acc.verdict = `<b>Savcılık dosyayı geri çevirdi.</b><br>Suçlamanın 3 noktasından <b>${ok}</b> tanesi tutuyor. Hangisinin yanlış olduğunu bulmak sana kalmış. Kalan hak: <b>${MAX_ATTEMPTS - S.attempts}</b>`;
  renderModal();
}

function computeRank(solved, time){
  if(!solved) return { ad: "Stajyer", puan: 0 };
  let p = 100 - S.hints * HINT_PENALTY - (S.attempts - 1) * 25;
  const min = time / 60; if(min > 10) p -= Math.min(20, Math.floor(min - 10));
  p = Math.max(5, p);
  const ad = p >= 90 ? "Sherlock" : p >= 75 ? "Başkomiser" : p >= 55 ? "Dedektif" : "Çaylak";
  return { ad, puan: p };
}

function finish(solved){
  const time = (Date.now() - S.start) / 1000;
  const r = computeRank(solved, time);
  S.done = { solved, time, rank: r.ad, puan: r.puan, accuracy: Math.round(100 * S.correctParts / S.totalParts) };
  saveState(); clearInterval(timerInt); closeModal(); renderResult();
}

        <div><small>İpucu</small><b>${S.hints}/${CUR.ipuclari.length}</b></div>
        <div><small>Doğruluk</small><b>%${d.accuracy}</b></div>
        <div><small>Deneme</small><b>${S.attempts}/${MAX_ATTEMPTS}</b></div>
      </div>
      <div class="eyebrow" style="margin-top:14px">Kazandığın rütbe</div>
      <div class="rank">${d.rank}</div>
    </article>

    <div class="sharebox" id="shareTxt">${esc(txt)}</div>
    <div class="share-actions">
      <a class="btn x-btn" href="https://x.com/intent/post?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">𝕏'te Paylaş</a>
      <button class="btn btn-ghost" id="copyBtn">Metni Kopyala</button>
    </div>

    <details class="solution">
      <summary>📁 Çözüm Dosyasını Aç <span>+</span></summary>
      <div class="paper">
        <h5>Sonuç</h5><p>${esc(c.ozet)}</p>
        <h5>Gerçekte ne oldu?</h5>${c.hikaye.map(p => `<p style="margin-top:8px">${esc(p)}</p>`).join("")}
        <h5>Diğerleri neden suçsuz?</h5>${c.eleme.map(e => `<p style="margin-top:8px"><b>${esc(e.ad)}:</b> ${esc(e.metin)}</p>`).join("")}
        <h5>Yanıltmacalar</h5><ul style="padding-left:18px">${c.yaniltmacalar.map(y => `<li style="margin-top:6px">${esc(y)}</li>`).join("")}</ul>
      </div>
    </details>

    <div style="display:grid;gap:10px;margin-top:18px">
      <button class="btn btn-gold" id="homeBtn">Ana Sayfaya Dön</button>
      <button class="btn btn-ghost" id="resetBtn" style="font-size:13px">Bu vakayı sıfırla (test için)</button>
    </div>`;
  show("result");
  $("copyBtn").onclick = async () => {
    try{ await navigator.clipboard.writeText(txt); toast("Kopyalandı"); }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("shareTxt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Metni seçtim, kopyalayabilirsin"); }
  };
  $("homeBtn").onclick = () => { renderHome(); show("home"); };
  $("resetBtn").onclick = () => { store.set("gd_" + CUR.id, freshState()); renderHome(); show("home"); toast("Vaka sıfırlandı"); };
}

/* ---------- Başlat ---------- */
renderHome(); show("home");
})();
</script>
</body>
</html>
